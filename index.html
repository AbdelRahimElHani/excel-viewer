<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Excel Viewer</h1>
      <p>Upload an .xlsx file to display its data. The file stays in your browser.</p>
    </header>

    <label class="upload" id="dropZone" for="fileInput">
      <input type="file" id="fileInput" accept=".xlsx">
      <span class="upload-title">Choose an Excel file</span>
      <span class="upload-hint">or drag and drop it here</span>
    </label>

    <p class="status" id="status" role="status"></p>

    <nav class="tabs" id="tabs" aria-label="Sheets"></nav>

    <div class="table-wrap" id="tableWrap" hidden>
      <table id="table"></table>
    </div>
  </main>

  <!-- XLSX library (SheetJS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
